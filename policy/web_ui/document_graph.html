<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>制度文件关系图谱</title>
<style>
:root{font-family:Helvetica,Arial,"Microsoft YaHei",sans-serif;color:#17202b;background:#f7f7f8;--accent:#002fa7;--line:#d9dce2}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid var(--line);padding:26px 32px;display:flex;justify-content:space-between;gap:24px}h1{font-size:25px;margin:0 0 10px;font-weight:650}h2{font-size:17px;margin:0 0 14px}h3{font-size:15px}p{line-height:1.65;margin:8px 0}.muted{color:#626a76;font-size:13px}.metrics{display:flex;gap:25px;white-space:nowrap}.metrics strong{font-size:30px;font-weight:500;color:var(--accent);display:block}.layout{display:grid;grid-template-columns:280px minmax(380px,1fr) 340px;min-height:calc(100vh - 150px)}aside,main{padding:23px;border-right:1px solid var(--line);min-width:0}aside{background:#fff}input[type=search]{width:100%;padding:11px;border:1px solid var(--line);font:inherit;margin-bottom:12px}button{font:inherit;cursor:pointer}#documents{max-height:70vh;overflow:auto}.document{width:100%;background:#fff;border:0;border-bottom:1px solid var(--line);padding:13px 8px;text-align:left;line-height:1.5;font-size:13px}.document.selected{color:var(--accent);border-left:3px solid var(--accent);background:#f4f6fc}.filters{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;margin:15px 0}.canvas{overflow:auto;border:1px solid var(--line);background:#fff;max-height:64vh}svg{width:100%;min-width:620px;display:block}svg text{font-size:12px;fill:#17202b}svg .node{cursor:pointer}svg .node:hover rect{stroke-width:2}#relations{margin-top:18px;max-height:36vh;overflow:auto}.relation{display:block;width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);text-align:left;padding:12px 4px;font-size:13px;line-height:1.6}.relation:hover{color:var(--accent)}.evidence{white-space:pre-wrap;overflow-wrap:anywhere;border-left:2px solid var(--accent);padding:10px 14px;background:#f7f7f8;margin:12px 0;font-size:14px}.badge{display:inline-block;border:1px solid var(--line);padding:2px 6px;margin:4px 6px 4px 0;font-size:12px}#detail{max-height:80vh;overflow:auto}.notice{padding:12px;border:1px solid var(--line);margin-top:20px;font-size:13px}@media(max-width:1100px){.layout{grid-template-columns:240px 1fr}.detail-pane{grid-column:1/-1;border-top:1px solid var(--line)}}@media(max-width:700px){header{display:block;padding:20px}.metrics{margin-top:15px}.layout{display:block}#documents{max-height:220px}aside,main{padding:18px}}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.toolbar button{background:white;border:1px solid var(--line);padding:8px 12px;font-size:13px}.toolbar button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:white}.toolbar .zoom-start{margin-left:auto}button:focus-visible,svg .node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}svg.overview{height:62vh;min-height:440px;min-width:0;touch-action:none;cursor:grab}svg.overview.dragging{cursor:grabbing}svg .global-label{font-size:11px;paint-order:stroke;stroke:white;stroke-width:3px;stroke-linejoin:round;pointer-events:none}svg .node:hover circle{stroke-width:2}
</style>
<header><div><h1>制度文件关系图谱</h1><p class="muted">从全库关联进入文件原文。箭头表示关系方向，不代表效力传递。</p></div><div class="metrics" id="metrics"></div></header>
<div class="layout"><aside><h2>选择文件</h2><input id="search" type="search" placeholder="搜索名称或文号"><p id="list-count" class="muted"></p><div id="documents"></div></aside>
<main><nav class="toolbar" aria-label="图谱视图"><button id="mode-global" aria-pressed="true">全库总图</button><button id="mode-local" aria-pressed="false">文件局部图</button><button class="zoom-start" id="zoom-in" aria-label="放大总图">放大</button><button id="zoom-out" aria-label="缩小总图">缩小</button><button id="fit-view">适应画布</button></nav><h2 id="focus-title"></h2><p id="focus-meta" class="muted"></p><div class="filters"><label><input type="checkbox" id="show-mentions"> 显示普通提及</label><label><input type="checkbox" id="show-pending" checked> 显示待审核废止</label><label id="external-filter"><input type="checkbox" id="show-external"> 总图包含未解析目标</label></div><p id="view-count" class="muted"></p><div class="canvas"><svg id="graph" role="img" aria-label="当前文件的直接关系"></svg></div><div id="relations"></div><p id="graph-help" class="muted"></p><p class="muted"><span style="color:#002fa7">蓝色：引用</span>；<span style="color:#c62828">红色：废止</span>。待审核废止使用红色虚线，普通提及使用蓝色点线。节点越大、蓝线越粗越明显，表示目标文件被更多不同文件引用（全库统计，不代表效力或可信度）。悬停节点可突出它的关联、淡化其他连线。箭头不代表效力传递。</p></main>
<aside class="detail-pane"><h2>关系依据</h2><div id="detail"><p class="muted">总图支持滚轮缩放、空白处拖动。点击文件进入局部图，点击关系查看原文依据。</p></div><div class="notice">未入库或版本歧义的节点不等于无效文件。机器识别结果需核对原文；本页面不会自动更改制度效力。</div></aside></div>
<script id="graph-data" type="application/json">__DOCUMENT_GRAPH_DATA__</script>
<script>__DOCUMENT_GRAPH_SCRIPT__</script>
</html>
